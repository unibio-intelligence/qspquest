[package]
name = "qspquest-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
managed = []
analysis = []
widget = []
sandbox = ["dep:wasmtime"]

[dependencies]
qspquest-modeling.workspace = true
qspquest-core.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "client", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = "0.8"
sha2 = "0.10"
include_dir = "0.7"
zip = { version = "8", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
flate2 = "1"
tar = "0.4"
wasmtime = { version = "=48.0.4", optional = true, default-features = false, features = ["cranelift", "runtime", "std"] }

[[example]]
name = "parity_audit"
required-features = ["sandbox"]
