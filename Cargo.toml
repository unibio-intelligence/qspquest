[workspace]
members = ["crates/qspquest-core", "crates/qspquest-modeling", "bindings/wasm", "bindings/cli", "bindings/mcp", "bindings/python", "bindings/r/src/rust"]
default-members = ["crates/qspquest-core", "crates/qspquest-modeling", "bindings/cli"]
exclude = ["vendor/diffsol"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
qspquest-core = { path = "crates/qspquest-core" }
qspquest-modeling = { path = "crates/qspquest-modeling" }
diffsol = { path = "vendor/diffsol/crates/diffsol", version = "=0.18.0", default-features = false, features = ["nalgebra", "faer", "deterministic"] }

[profile.release]
lto = "thin"
codegen-units = 1
