[workspace]
members = ["crates/qspquest-core", "crates/qspquest-modeling", "bindings/wasm", "bindings/cli", "bindings/mcp", "bindings/python", "bindings/r/src/rust"]
default-members = ["crates/qspquest-core", "crates/qspquest-modeling", "bindings/cli"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
qspquest-core = { path = "crates/qspquest-core", version = "=0.1.1" }
qspquest-modeling = { path = "crates/qspquest-modeling", version = "=0.1.1" }
# Published crates require Diffsol from crates.io. QSPQuest's own builds patch it
# to the exact upstream revision below, which adds fixes released after 0.18.0.
diffsol = { version = "0.18", default-features = false, features = ["nalgebra", "faer"] }

[patch.crates-io]
diffsol = { git = "https://github.com/martinjrobins/diffsol", rev = "883d9a09238c2e0b465f0f1549c462b8c38ea1b2" }

[profile.release]
lto = "thin"
codegen-units = 1
