name: CI
on:
  push:
    branches: [main]
    paths: ['crates/**', 'bindings/**', 'conformance/**', 'spec/**', 'docs/**', 'examples/**', 'scripts/**', 'Dockerfile', 'docker/**', 'Cargo.*', '.cargo/**', '.gitattributes', 'pyproject.toml', '.github/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-ci-${{ github.event_name == 'push' && github.ref || format('qualification-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  workspace:
    runs-on: ubuntu-24.04
    # Debug-profile population fitting tests need more than 20 minutes on a
    # cold cache.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Repository checks
        run: |
          python3 scripts/check_build_pins.py
          python3 scripts/generate_figure_style.py --check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Script tests
        run: |
          python -m pip install pytest jsonschema
          python -B -m pytest -q -p no:cacheprovider scripts/tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: rustup default 1.98.1
      - run: cargo fmt --all -- --check
      - name: Core, modeling and CLI tests
        if: github.event_name != 'workflow_dispatch'
        run: cargo test -p qspquest-modeling -p qspquest-core -p qspquest-cli --locked
      - run: node --test bindings/wasm/js/client.test.mjs bindings/wasm/quickstart/app.test.mjs
      - name: Full workspace release check
        if: github.event_name == 'workflow_dispatch'
        run: cargo test --workspace --locked
      - name: Browser target release check
        if: github.event_name == 'workflow_dispatch'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p qspquest-wasm --locked --target wasm32-unknown-unknown
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # 1.98.1
      # NumPy and SciPy are independent references in the tests, not package dependencies.
      - run: python -m pip install '.[notebook,interchange,docs,plot]' pytest numpy scipy
      - run: qspquest-doctor --analysis --interchange
      - run: python -m pytest -p no:cacheprovider bindings/python/tests
      - name: Tutorial outputs and figures
        run: python scripts/check_tutorial_outputs.py
  r-binding:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: rustup default 1.98.1
      - run: Rscript -e 'install.packages(c("jsonlite", "testthat", "ggplot2"), repos="https://cloud.r-project.org")'
      - run: cargo fetch --locked
      - run: R CMD INSTALL bindings/r
      - name: Package tests
        run: Rscript -e 'testthat::test_dir("bindings/r/tests/testthat", package = "qspquest", load_package = "installed", stop_on_failure = TRUE)'
      - run: QSPQUEST_R_REPORT=r-checks.json Rscript scripts/native-r.R
