name: Documentation and synthetic tutorial
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check immutable build inputs
        run: python3 scripts/check_build_pins.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # 1.98.1
      - run: python -m pip install '.[notebook,docs,interchange]' pytest
      - name: Check documentation links and site builders
        run: python -B -m unittest discover -s scripts/tests -p test_documentation.py -v
      - run: qspquest-doctor --analysis
      - name: Execute synthetic OMEX notebook
        run: python -m nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=120 docs/tutorials/synthetic.ipynb
      - run: python scripts/build_docs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-site
          path: docs/_site
