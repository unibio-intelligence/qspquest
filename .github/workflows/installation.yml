name: Installation artifacts
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to verify
        type: choice
        default: all
        options: [all, windows]
permissions:
  contents: read
jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.platform == 'windows' && '[{"runner":"windows-latest","target":"x86_64-pc-windows-msvc","manylinux":"auto"}]' || '[{"runner":"macos-14","target":"aarch64-apple-darwin","manylinux":"auto"},{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","manylinux":"2_28"},{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","manylinux":"2_28"},{"runner":"windows-latest","target":"x86_64-pc-windows-msvc","manylinux":"auto"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Preserve Windows source checkout
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check immutable build inputs
        run: python3 scripts/check_build_pins.py
      - run: python3 scripts/check_diffsol_rosenbrock_sync.py
      - run: python3 -B -m unittest discover -s scripts/tests -p test_source_identity.py
      - run: python3 -B -m unittest discover -s scripts/tests -p test_distribution.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: '1.15.0'
          rust-toolchain: '1.98.1'
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out wheelhouse
      - run: python scripts/check_distribution.py wheelhouse
      - name: Install core wheel without analysis dependencies
        run: python scripts/install_wheel.py wheelhouse
      - run: qspquest-doctor --json > doctor-core.json
      - name: Verify installed compiler source and target
        run: python scripts/check_source_identity.py --doctor doctor-core.json --target ${{ matrix.target }}
      - run: python -m qspquest.first_run --out developer-results
      - run: qspquest-library --help
      - name: Install analysis and notebook dependencies
        run: python scripts/install_wheel.py wheelhouse --extra notebook,interchange
      - run: python -m pip install pytest
      - run: qspquest-doctor --analysis --interchange --json
      - name: Scientific and restart checks on installed wheel
        run: python -m pytest -p no:cacheprovider bindings/python/tests
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python scripts/install_wheel.py wheelhouse --extra analysis,interchange
      - run: qspquest-doctor --analysis --interchange --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.target }}
          path: wheelhouse/*.whl
  source-archive:
    if: inputs.platform != 'windows'
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve Windows source checkout
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check immutable build inputs
        run: python3 scripts/check_build_pins.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # 1.98.1
      - run: python -m pip install maturin==1.15.0
      - run: maturin sdist --out sourcehouse
      - run: python scripts/check_distribution.py sourcehouse
      - name: Rebuild isolated source archive
        run: python -m pip wheel --no-deps --wheel-dir rebuilt sourcehouse/*.tar.gz
      - run: python scripts/install_wheel.py rebuilt
      - run: qspquest-doctor --json > doctor-rebuilt.json
      - name: Verify rebuilt compiler source and target
        run: python scripts/check_source_identity.py --doctor doctor-rebuilt.json --target x86_64-unknown-linux-gnu
      - run: qspquest-library --help
      - run: python scripts/install_wheel.py rebuilt --extra interchange
      - run: qspquest-doctor --interchange --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-archive
          path: sourcehouse/*.tar.gz
