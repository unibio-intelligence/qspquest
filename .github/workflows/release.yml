name: Release
# A pushed vMAJOR.MINOR.PATCH tag builds the Python wheels, the source archive
# and the MCP image, then publishes them to the GitHub release, PyPI, crates.io
# and GHCR. Registry uploads use Trusted Publishing. A manual dispatch runs
# every build and package check, publishing nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/unibio-intelligence/qspquest-mcp

jobs:
  version:
    if: github.repository == 'unibio-intelligence/qspquest' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check immutable build inputs
        run: python3 scripts/check_build_pins.py
      - name: Require the tag to match the Python and Cargo versions
        id: check
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          python = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          cargo = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', python):
              raise SystemExit('Use a MAJOR.MINOR.PATCH version in pyproject.toml')
          if cargo != python:
              raise SystemExit(f'Cargo version {cargo} differs from Python version {python}')
          if os.environ['EVENT'] == 'push' and os.environ['REF_NAME'] != 'v' + python:
              raise SystemExit(f"Tag {os.environ['REF_NAME']} does not match version v{python}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={python}\n')
          PY

  # pyo3 uses abi3-py310: one cp310-abi3 wheel per platform serves CPython 3.10+.
  wheel:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, manylinux: '2_28'}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: '2_28'}
          - {runner: macos-15, target: aarch64-apple-darwin, manylinux: auto}
          - {runner: macos-15-intel, target: x86_64-apple-darwin, manylinux: auto}
          - {runner: windows-latest, target: x86_64-pc-windows-msvc, manylinux: auto}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Preserve Windows source checkout
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: '1.15.0'
          rust-toolchain: '1.98.1'
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out wheelhouse
      - run: python scripts/check_distribution.py wheelhouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-wheel-${{ matrix.target }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # Install each wheel on the oldest and newest supported CPython in this range.
  wheel-test:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
        platform:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {runner: macos-15, target: aarch64-apple-darwin}
          - {runner: macos-15-intel, target: x86_64-apple-darwin}
          - {runner: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Preserve Windows source checkout
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-wheel-${{ matrix.platform.target }}
          path: wheelhouse
      - run: python scripts/install_wheel.py wheelhouse
      - run: qspquest-doctor --json > doctor.json
      - name: Verify installed compiler source and target
        run: python scripts/check_source_identity.py --doctor doctor.json --target ${{ matrix.platform.target }}
      - name: Run the packaged first-run example outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -m qspquest.first_run --out first-run

  sdist:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # 1.98.1
      - run: python -m pip install maturin==1.15.0
      - run: maturin sdist --out sourcehouse
      - run: python scripts/check_distribution.py sourcehouse
      - name: Rebuild from the source archive (resolves the locked Diffsol Git patch)
        run: python -m pip wheel --no-deps --wheel-dir rebuilt sourcehouse/*.tar.gz
      - run: python scripts/install_wheel.py rebuilt
      - run: qspquest-doctor --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-sdist
          path: sourcehouse/*.tar.gz
          if-no-files-found: error

  # Native runners per architecture; the multi-architecture tag is assembled
  # from pushed digests in mcp-image-publish.
  mcp-image:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, architecture: amd64}
          - {runner: ubuntu-24.04-arm, architecture: arm64}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the public MCP image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: bindings/mcp/Dockerfile
          target: public
          platforms: linux/${{ matrix.architecture }}
          load: true
          push: false
          tags: qspquest-mcp:local
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-mcp-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=release-mcp-${{ matrix.architecture }}
      - name: Check the starter model over HTTP and offline stdio with no extra arguments
        run: |
          docker run -d --name mcp-starter --init -p 127.0.0.1:18766:8080 --read-only \
            --cap-drop ALL --security-opt no-new-privileges qspquest-mcp:local
          trap 'docker logs mcp-starter; docker rm -f mcp-starter' EXIT
          python3 bindings/mcp/scripts/quickstart.py --url http://127.0.0.1:18766/mcp
          python3 bindings/mcp/scripts/quickstart.py --stdio-image qspquest-mcp:local
      - name: Log in to GHCR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # Same inputs and builder cache as the tested build, so the layers are reused.
      - name: Push the tested image by digest
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: bindings/mcp/Dockerfile
          target: public
          platforms: linux/${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-mcp-${{ matrix.architecture }}
      - name: Record the pushed digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push'
        with:
          name: mcp-digest-${{ matrix.architecture }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  github-release:
    if: github.event_name == 'push'
    needs: [version, wheel, wheel-test, sdist, mcp-image, rust-crates-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Check the complete distribution set
        run: |
          python3 scripts/check_distribution.py dist
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 5
          test -f "dist/qspquest-${VERSION}.tar.gz"
      - name: Generate the source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/qspquest-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance for the wheels and source archive
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest the SBOM for the wheels and source archive
        id: sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: ${{ runner.temp }}/qspquest-${{ env.VERSION }}.spdx.json
      - name: Add the SBOM, attestation bundles and checksums
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$RUNNER_TEMP/qspquest-${VERSION}.spdx.json" dist/
          cp "$PROVENANCE" "dist/qspquest-${VERSION}.provenance.jsonl"
          cp "$SBOM_BUNDLE" "dist/qspquest-${VERSION}.sbom-attestation.jsonl"
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      # A release drafted in the GitHub UI for this tag keeps its notes and gets the files.
      - name: Create or update the GitHub release
        run: |
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/* --clobber
            exit 0
          fi
          gh release create "v${VERSION}" dist/* \
            --verify-tag --title "QSPQuest ${VERSION}" --generate-notes \
            --notes "Install with \`pip install qspquest==${VERSION}\`. MCP server image: \`${IMAGE}:${VERSION}\`. Verify a download with \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`; the SBOM and attestation bundles are attached."

  rust-crates-check:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # 1.98.1
      - name: Verify both Rust registry packages without uploading
        run: cargo publish --dry-run --locked --registry crates-io -p qspquest-core -p qspquest-modeling

  crates:
    if: github.event_name == 'push'
    needs: [version, github-release, rust-crates-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # 1.98.1
      - name: Authenticate to crates.io with GitHub OIDC
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the Rust library crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --locked --registry crates-io -p qspquest-core -p qspquest-modeling

  pypi:
    if: github.event_name == 'push'
    needs: [version, github-release]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/qspquest/${{ needs.version.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  mcp-image-publish:
    if: github.event_name == 'push'
    needs: [version, mcp-image, github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mcp-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Tag the multi-architecture image as the version and latest
        working-directory: digests
        run: |
          digests=(*)
          test "${#digests[@]}" -eq 2
          sources=()
          for digest in "${digests[@]}"; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            --annotation "index:org.opencontainers.image.description=QSPQuest MCP server with a synthetic starter model" \
            --tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
      - name: Record the image index digest
        id: index
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Generate the image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.index.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          format: spdx-json
          output-file: ${{ runner.temp }}/qspquest-mcp.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Attest the image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          sbom-path: ${{ runner.temp }}/qspquest-mcp.spdx.json
          push-to-registry: true
