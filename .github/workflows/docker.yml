name: Docker images
on:
  push:
    branches: [main]
    paths: ['.cargo/**', '.gitattributes', 'Cargo.*', 'Dockerfile', 'compose.yaml', '.dockerignore', 'docker/**', 'crates/**', 'bindings/**', 'conformance/**', 'pyproject.toml', 'examples/**', 'docs/**', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      release_arm64:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-docker-${{ github.event_name == 'push' && github.ref || format('qualification-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' && !inputs.release_arm64 }}

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.release_arm64 && '["runtime", "notebook", "r"]' || '["runtime", "notebook", "r", "full"]') }}
    runs-on: ${{ inputs.release_arm64 && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      ARCHITECTURE: ${{ inputs.release_arm64 && 'arm64' || 'amd64' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ env.ARCHITECTURE }}
          load: true
          push: false
          tags: qspquest:ci
          cache-from: type=gha,scope=qspquest-${{ env.ARCHITECTURE }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=qspquest-${{ env.ARCHITECTURE }}-${{ matrix.target }}
      - name: Check CLI, Python and interchange
        if: matrix.target == 'runtime'
        run: python scripts/test_container.py --image qspquest:ci --out container-check.json
      - name: Execute synthetic notebook and check Jupyter startup
        if: matrix.target == 'notebook'
        run: python scripts/test_container.py --image qspquest:ci --notebook --out container-check.json
      - name: Check notebook with host user ownership
        if: matrix.target == 'notebook'
        run: python scripts/test_container.py --image qspquest:ci --notebook --user "$(id -u):$(id -g)" --out host-user-check.json
      - name: Check installed native R package
        if: matrix.target == 'r'
        run: docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /work:rw,mode=1777 qspquest:ci Rscript /opt/qspquest/r_quickstart.R
      - name: Check CLI, Python, notebook, R, MCP stdio and the default command
        if: matrix.target == 'full'
        run: python scripts/test_container.py --image qspquest:ci --full --out container-check.json
      - name: Check notebook and R with host user ownership
        if: matrix.target == 'full'
        run: python scripts/test_container.py --image qspquest:ci --notebook --r --user "$(id -u):$(id -g)" --out host-user-check.json
      - name: Save provenance records
        run: |
          docker run --rm --network none qspquest:ci tar -C /opt/qspquest -cf - inventories > inventories.tar
          docker image inspect qspquest:ci > image-inspect.json
          docker run --rm --network none qspquest:ci cat /opt/qspquest/build-info.json > build-info.json
          docker run --rm --network none qspquest:ci cat /opt/qspquest/requirements.freeze.txt > requirements.freeze.txt
      # Retain image downloads for explicit qualification runs only.
      # The release workflow publishes the full image separately.
      - name: Save the image archive
        if: (github.event_name != 'push' || inputs.release_arm64) && matrix.target != 'full'
        run: |
          docker save qspquest:ci | gzip > qspquest-${{ matrix.target }}-${{ env.ARCHITECTURE }}.tar.gz
          sha256sum qspquest-*.tar.gz > image-archive.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qspquest-${{ matrix.target }}-${{ env.ARCHITECTURE }}
          retention-days: 7
          path: |
            qspquest-*.tar.gz
            image-archive.sha256
            container-check.json
            host-user-check.json
            image-inspect.json
            build-info.json
            requirements.freeze.txt
            inventories.tar
