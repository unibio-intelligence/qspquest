name: Docker images
on:
  pull_request:
    paths: ['.cargo/**', '.gitattributes', 'Cargo.*', 'Dockerfile', 'compose.yaml', '.dockerignore', 'docker/**', 'crates/**', 'bindings/**', 'vendor/**', 'conformance/**', 'pyproject.toml', 'examples/**', 'docs/**', 'scripts/**', '.github/workflows/**', '.github/workflows/suite.yml', '.github/suite-compatibility.json']
  push:
    branches: [main]
    paths: ['.cargo/**', '.gitattributes', 'Cargo.*', 'Dockerfile', 'compose.yaml', '.dockerignore', 'docker/**', 'crates/**', 'bindings/**', 'vendor/**', 'conformance/**', 'pyproject.toml', 'examples/**', 'docs/**', 'scripts/**', '.github/workflows/**', '.github/workflows/suite.yml', '.github/suite-compatibility.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            target: runtime
          - runner: ubuntu-24.04-arm
            architecture: arm64
            target: runtime
          - runner: ubuntu-24.04
            architecture: amd64
            target: notebook
          - runner: ubuntu-24.04-arm
            architecture: arm64
            target: notebook
          - runner: ubuntu-24.04
            architecture: amd64
            target: r
          - runner: ubuntu-24.04-arm
            architecture: arm64
            target: r
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check immutable build inputs
        run: python3 scripts/check_build_pins.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.architecture }}
          load: true
          push: false
          tags: qspquest:ci
          cache-from: type=gha,scope=qspquest-${{ matrix.architecture }}-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=qspquest-${{ matrix.architecture }}-${{ matrix.target }}
      - name: Check CLI, Python and interchange
        if: matrix.target == 'runtime'
        run: python scripts/test_container.py --image qspquest:ci --out container-check.json
      - name: Execute synthetic notebook and check Jupyter startup
        if: matrix.target == 'notebook'
        run: python scripts/test_container.py --image qspquest:ci --notebook --out container-check.json
      - name: Check notebook with host user ownership
        if: matrix.target == 'notebook'
        run: python scripts/test_container.py --image qspquest:ci --notebook --user "$(id -u):$(id -g)" --out host-user-check.json
      - name: Check installed native R package
        if: matrix.target == 'r'
        run: docker run --rm --network none --read-only --tmpfs /tmp --tmpfs /work:rw,mode=1777 qspquest:ci Rscript /opt/qspquest/r_quickstart.R
      - name: Save tested image and provenance
        run: |
          docker run --rm --network none qspquest:ci tar -C /opt/qspquest -cf - inventories > inventories.tar
          docker image inspect qspquest:ci > image-inspect.json
          docker run --rm --network none qspquest:ci cat /opt/qspquest/build-info.json > build-info.json
          docker run --rm --network none qspquest:ci cat /opt/qspquest/requirements.freeze.txt > requirements.freeze.txt
          docker save qspquest:ci | gzip > qspquest-${{ matrix.target }}-${{ matrix.architecture }}.tar.gz
          sha256sum qspquest-*.tar.gz > image-archive.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qspquest-${{ matrix.target }}-${{ matrix.architecture }}
          retention-days: 7
          path: |
            qspquest-*.tar.gz
            image-archive.sha256
            container-check.json
            host-user-check.json
            image-inspect.json
            build-info.json
            requirements.freeze.txt
            inventories.tar
