[package]
name = "qspquest-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "Scientific request, event and result types for QSPQuest"
repository = "https://github.com/unibio-intelligence/qspquest"
readme = "README.md"
rust-version = "1.98"
include = ["Cargo.toml", "src/**", "test-data/**", "examples/export_schemas.rs", "README.md", "LICENSE"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_jcs = "=0.2.0"
sha2 = "=0.10.9"
schemars = { version = "=0.8.22", optional = true }

[features]
schema = ["dep:schemars"]

[[example]]
name = "export_schemas"
required-features = ["schema"]
